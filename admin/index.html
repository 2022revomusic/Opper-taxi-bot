<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>OPPER TAXI — Admin Panel</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            background: #f4f6f8;
            color: #111827;
        }

        .topbar {
            background: #111827;
            color: white;
            padding: 18px 24px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            position: sticky;
            top: 0;
            z-index: 10;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 42px;
            height: 42px;
            border-radius: 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #facc15;
            color: #111827;

            font-size: 21px;
            font-weight: 800;
        }

        .brand h1 {
            font-size: 20px;
        }

        .brand p {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 2px;
        }

        .refresh-btn {
            border: none;
            background: #facc15;
            color: #111827;

            padding: 10px 16px;
            border-radius: 10px;

            font-weight: 700;
            cursor: pointer;
        }

        .refresh-btn:active {
            transform: scale(.97);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
        }

        .welcome {
            margin-bottom: 22px;
        }

        .welcome h2 {
            font-size: 26px;
            margin-bottom: 5px;
        }

        .welcome p {
            color: #6b7280;
        }

        .stats {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(180px, 1fr));

            gap: 16px;
            margin-bottom: 28px;
        }

        .stat-card {
            background: white;
            border-radius: 16px;
            padding: 20px;

            box-shadow:
                0 4px 18px rgba(0, 0, 0, .05);

            border: 1px solid #e5e7eb;
        }

        .stat-icon {
            font-size: 26px;
            margin-bottom: 12px;
        }

        .stat-title {
            font-size: 13px;
            color: #6b7280;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 28px;
            font-weight: 800;
        }

        .section {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;

            border: 1px solid #e5e7eb;

            box-shadow:
                0 4px 18px rgba(0, 0, 0, .04);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 16px;
        }

        .section-title {
            font-size: 19px;
            font-weight: 800;
        }

        .badge {
            background: #fef3c7;
            color: #92400e;

            padding: 6px 10px;
            border-radius: 20px;

            font-size: 12px;
            font-weight: 700;
        }

        .driver-list {
            display: grid;
            gap: 12px;
        }

        .driver-card {
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 15px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 15px;
        }

        .driver-info {
            min-width: 0;
        }

        .driver-name {
            font-weight: 700;
            margin-bottom: 5px;
        }

        .driver-meta {
            font-size: 13px;
            color: #6b7280;
            line-height: 1.5;
        }

        .driver-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }

        button {
            font-family: inherit;
        }

        .btn {
            border: none;
            border-radius: 9px;
            padding: 9px 13px;

            cursor: pointer;
            font-weight: 700;
        }

        .btn-approve {
            background: #dcfce7;
            color: #166534;
        }

        .btn-reject {
            background: #fee2e2;
            color: #991b1b;
        }

        .empty {
            padding: 25px;
            text-align: center;
            color: #9ca3af;
        }

        .loading {
            padding: 25px;
            text-align: center;
            color: #6b7280;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;

            padding: 14px;
            border-radius: 10px;

            margin-bottom: 18px;
            display: none;
        }

        .status {
            display: inline-flex;
            align-items: center;

            padding: 5px 9px;
            border-radius: 20px;

            font-size: 11px;
            font-weight: 700;
        }

        .status-pending {
            background: #fef3c7;
            color: #92400e;
        }

        .status-approved {
            background: #dcfce7;
            color: #166534;
        }

        .status-rejected {
            background: #fee2e2;
            color: #991b1b;
        }

        .footer {
            text-align: center;
            color: #9ca3af;
            font-size: 12px;
            padding: 20px;
        }

        @media (max-width: 650px) {
            .container {
                padding: 15px;
            }

            .topbar {
                padding: 14px 15px;
            }

            .brand h1 {
                font-size: 17px;
            }

            .refresh-btn {
                padding: 8px 11px;
                font-size: 12px;
            }

            .welcome h2 {
                font-size: 22px;
            }

            .driver-card {
                align-items: flex-start;
                flex-direction: column;
            }

            .driver-actions {
                width: 100%;
            }

            .driver-actions .btn {
                flex: 1;
            }
        }
    </style>
</head>

<body>

<header class="topbar">

    <div class="brand">

        <div class="logo">
            🚕
        </div>

        <div>
            <h1>OPPER TAXI</h1>
            <p>Administrator Panel</p>
        </div>

    </div>

    <button
        class="refresh-btn"
        onclick="loadDashboard()"
    >
        🔄 Yangilash
    </button>

</header>


<main class="container">

    <div class="welcome">

        <h2>
            Dashboard
        </h2>

        <p>
            OPPER TAXI tizimini boshqarish paneli
        </p>

    </div>


    <div
        id="error"
        class="error"
    ></div>


    <!-- STATISTICS -->

    <section class="stats">

        <div class="stat-card">

            <div class="stat-icon">
                👥
            </div>

            <div class="stat-title">
                Foydalanuvchilar
            </div>

            <div
                class="stat-value"
                id="users"
            >
                —
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-icon">
                🚕
            </div>

            <div class="stat-title">
                Haydovchilar
            </div>

            <div
                class="stat-value"
                id="drivers"
            >
                —
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-icon">
                ⏳
            </div>

            <div class="stat-title">
                Kutilayotgan arizalar
            </div>

            <div
                class="stat-value"
                id="pending-drivers"
            >
                —
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-icon">
                🛣
            </div>

            <div class="stat-title">
                Faol safarlar
            </div>

            <div
                class="stat-value"
                id="active-rides"
            >
                —
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-icon">
                📦
            </div>

            <div class="stat-title">
                Kutilayotgan buyurtmalar
            </div>

            <div
                class="stat-value"
                id="pending-orders"
            >
                —
            </div>

        </div>


        <div class="stat-card">

            <div class="stat-icon">
                ⭐
            </div>

            <div class="stat-title">
                Reytinglar
            </div>

            <div
                class="stat-value"
                id="ratings"
            >
                —
            </div>

        </div>

    </section>


    <!-- DRIVER APPLICATIONS -->

    <section class="section">

        <div class="section-header">

            <div class="section-title">
                🚕 Haydovchi arizalari
            </div>

            <div
                class="badge"
                id="pending-badge"
            >
                0 ta
            </div>

        </div>


        <div
            id="drivers-list"
            class="driver-list"
        >

            <div class="loading">
                Yuklanmoqda...
            </div>

        </div>

    </section>


    <div class="footer">
        OPPER TAXI © 2026
    </div>

</main>


<script>

const API_BASE = "";


function showError(message) {

    const error = document.getElementById("error");

    error.textContent = message;

    error.style.display = "block";

}


function hideError() {

    const error = document.getElementById("error");

    error.style.display = "none";

}


function setText(id, value) {

    const element = document.getElementById(id);

    if (element) {
        element.textContent = value;
    }

}


function formatName(driver) {

    const first =
        driver[9] || "";

    const last =
        driver[10] || "";

    const username =
        driver[11] || "";

    const fullName =
        `${first} ${last}`.trim();

    if (fullName) {
        return fullName;
    }

    if (username) {
        return "@" + username;
    }

    return "Noma'lum foydalanuvchi";

}


function formatStatus(status) {

    if (status === "approved") {

        return `
            <span class="status status-approved">
                TASDIQLANGAN
            </span>
        `;

    }

    if (status === "rejected") {

        return `
            <span class="status status-rejected">
                RAD ETILGAN
            </span>
        `;

    }

    return `
        <span class="status status-pending">
            KUTILMOQDA
        </span>
    `;

}


function renderDrivers(drivers) {

    const container =
        document.getElementById("drivers-list");

    const badge =
        document.getElementById("pending-badge");


    badge.textContent =
        `${drivers.length} ta`;


    if (!drivers.length) {

        container.innerHTML = `
            <div class="empty">
                Hozircha kutilayotgan haydovchi arizalari yo'q.
            </div>
        `;

        return;

    }


    container.innerHTML =
        drivers.map(driver => {

            const id = driver[0];

            const phone =
                driver[2] || driver[11] || "Telefon yo'q";

            const created =
                driver[5]
                    ? new Date(driver[5]).toLocaleString("uz-UZ")
                    : "—";


            return `
                <div class="driver-card">

                    <div class="driver-info">

                        <div class="driver-name">
                            ${escapeHtml(formatName(driver))}
                        </div>

                        <div class="driver-meta">
                            📞 ${escapeHtml(phone)}
                            <br>
                            🆔 Driver ID: ${id}
                            <br>
                            🕐 ${escapeHtml(created)}
                            <br>
                            ${formatStatus(driver[3])}
                        </div>

                    </div>


                    <div class="driver-actions">

                        <button
                            class="btn btn-approve"
                            onclick="approveDriver(${id})"
                        >
                            ✅ Tasdiqlash
                        </button>


                        <button
                            class="btn btn-reject"
                            onclick="rejectDriver(${id})"
                        >
                            ❌ Rad etish
                        </button>

                    </div>

                </div>
            `;

        }).join("");

}


function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


async function loadDashboard() {

    hideError();


    try {

        const response =
            await fetch(
                `${API_BASE}/api/admin/dashboard`
            );


        if (!response.ok) {

            throw new Error(
                "Dashboard ma'lumotlarini olishda xatolik."
            );

        }


        const data =
            await response.json();


        if (!data.success) {

            throw new Error(
                data.error ||
                "Ma'lumotlarni olish imkoni bo'lmadi."
            );

        }


        const stats =
            data.stats || {};


        setText(
            "users",
            stats.users ?? 0
        );

        setText(
            "drivers",
            stats.drivers ?? 0
        );

        setText(
            "pending-drivers",
            stats.pending_drivers ?? 0
        );

        setText(
            "active-rides",
            stats.active_rides ?? 0
        );

        setText(
            "pending-orders",
            stats.pending_orders ?? 0
        );

        setText(
            "ratings",
            stats.total_ratings ?? 0
        );


        renderDrivers(
            data.pending_drivers || []
        );


    } catch (error) {

        console.error(error);

        showError(
            error.message ||
            "Noma'lum xatolik yuz berdi."
        );

        document.getElementById(
            "drivers-list"
        ).innerHTML = `
            <div class="empty">
                Ma'lumotlarni yuklab bo'lmadi.
            </div>
        `;

    }

}


async function approveDriver(driverId) {

    const confirmed =
        confirm(
            "Bu haydovchi arizasini tasdiqlaysizmi?"
        );


    if (!confirmed) {
        return;
    }


    try {

        const response =
            await fetch(
                `${API_BASE}/api/admin/driver/approve`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        driver_id: driverId
                    })
                }
            );


        const data =
            await response.json();


        if (!data.success) {

            throw new Error(
                data.error ||
                "Tasdiqlashda xatolik."
            );

        }


        await loadDashboard();


    } catch (error) {

        showError(
            error.message ||
            "Tasdiqlashda xatolik."
        );

    }

}


async function rejectDriver(driverId) {

    const reason =
        prompt(
            "Rad etish sababini yozing:"
        );


    if (reason === null) {
        return;
    }


    try {

        const response =
            await fetch(
                `${API_BASE}/api/admin/driver/reject`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        driver_id: driverId,
                        reason: reason
                    })
                }
            );


        const data =
            await response.json();


        if (!data.success) {

            throw new Error(
                data.error ||
                "Rad etishda xatolik."
            );

        }


        await loadDashboard();


    } catch (error) {

        showError(
            error.message ||
            "Rad etishda xatolik."
        );

    }

}


document.addEventListener(
    "DOMContentLoaded",
    loadDashboard
);

</script>

</body>
</html>
