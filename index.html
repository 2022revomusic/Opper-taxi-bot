/* =====================================================
   TELEGRAM
===================================================== */

const tg = window.Telegram
    ? window.Telegram.WebApp
    : null;

if(tg){

    tg.ready();

    tg.expand();

    try{
        tg.enableClosingConfirmation();
    }catch(e){}

}

const INIT_DATA =
    tg && tg.initData
        ? tg.initData
        : "";


/* =====================================================
   TELEGRAM USER
===================================================== */

function loadTelegramUser(){

    try{

        if(!tg || !tg.initDataUnsafe){
            return;
        }

        const user =
            tg.initDataUnsafe.user;

        if(!user){
            return;
        }

        let name =
            user.first_name || "";

        if(user.last_name){
            name +=
                " " + user.last_name;
        }

        if(!name){
            name =
                user.username
                ? "@" + user.username
                : "Telegram foydalanuvchisi";
        }

        document.getElementById(
            "username"
        ).textContent = name;

        const avatar =
            document.getElementById(
                "avatar"
            );

        if(user.first_name){

            avatar.textContent =
                user.first_name
                    .charAt(0)
                    .toUpperCase();

        }

    }
    catch(error){

        console.log(
            "Telegram user error:",
            error
        );

    }

}

/* =====================================================
   API
===================================================== */

async function api(
    url,
    data = {},
    method = "POST"
){

    const options = {

        method:method,

        headers:{
            "Content-Type":
                "application/json"
        }

    };


    if(method !== "GET"){

        options.body =
            JSON.stringify({

                ...data,

                init_data:
                    INIT_DATA

            });

    }


    if(INIT_DATA){

        options.headers[
            "X-Telegram-Init-Data"
        ] = INIT_DATA;

    }


    const response =
        await fetch(
            url,
            options
        );


    let result;

    try{

        result =
            await response.json();

    }
    catch(error){

        throw new Error(
            "Serverdan noto‘g‘ri javob keldi."
        );

    }


    if(
        !response.ok
        || result.ok === false
    ){

        throw new Error(
            result.error
            || result.message
            || "Xatolik yuz berdi."
        );

    }


    return result;

}


/* =====================================================
   TOAST
===================================================== */

let toastTimer = null;

function toast(message){

    const box =
        document.getElementById(
            "toast"
        );

    box.textContent =
        message || "Bajarildi";

    box.style.display =
        "block";


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            function(){

                box.style.display =
                    "none";

            },
            3000
        );

}


/* =====================================================
   TELEGRAM POPUP
===================================================== */

function telegramAlert(message){

    if(
        tg
        && typeof tg.showAlert === "function"
    ){

        tg.showAlert(
            message
        );

        return;

    }

    toast(message);

}


/* =====================================================
   PAGE
===================================================== */

function showPage(page){

    const passenger =
        document.getElementById(
            "passengerPage"
        );

    const driver =
        document.getElementById(
            "driverPage"
        );

    const passengerTab =
        document.getElementById(
            "passengerTab"
        );

    const driverTab =
        document.getElementById(
            "driverTab"
        );


    if(page === "driver"){

        passenger.classList.add(
            "hidden"
        );

        driver.classList.remove(
            "hidden"
        );

        passengerTab.classList.remove(
            "active"
        );

        driverTab.classList.add(
            "active"
        );

        loadMyRides();

    }
    else{

        driver.classList.add(
            "hidden"
        );

        passenger.classList.remove(
            "hidden"
        );

        driverTab.classList.remove(
            "active"
        );

        passengerTab.classList.add(
            "active"
        );

    }

}


/* =====================================================
   FILL REGIONS
===================================================== */

function fillRegions(id){

    const select =
        document.getElementById(id);

    if(!select){
        return;
    }


    select.innerHTML =
        '<option value="">Viloyatni tanlang</option>';


    Object.keys(
        REGIONS
    ).forEach(
        function(region){

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                region;

            option.textContent =
                region;

            select.appendChild(
                option
            );

        }
    );

}


/* =====================================================

===================================================== */

    regionId,
    districtId
){

    const regionSelect =
        document.getElementById(
            regionId
        );

    const districtSelect =
        document.getElementById(

/* =====================================================

function validSeats(value){

    const seats =
        Number(value);

    return (
        Number.isInteger(seats)
        && seats >= 1
        && seats <= 4
    );

}

/* =====================================================
   ORDER RIDE
===================================================== */

async function orderRide(
    rideId,
    available
){

    if(!rideId){

        toast(
            "Safar ID topilmadi."
        );

        return;

    }


    let seats =
        prompt(
            "Nechta joy kerak?\n\nBo‘sh joy: "
            + available
        );


    if(
        seats === null
        || seats.trim() === ""
    ){

        return;

    }


    seats =
        Number(
            seats
        );


    if(!Number.isInteger(seats)){

        toast(
            "Joylar sonini butun son kiriting."
        );

        return;

    }


    if(
        seats < 1
        || seats > 4
    ){

        toast(
            "Yo‘lovchilar soni 1–4 bo‘lishi kerak."
        );

        return;

    }


    if(
        seats > available
    ){

        toast(
            "Faqat "
            + available
            + " ta bo‘sh joy bor."
        );

        return;

    }


    let phone =
        prompt(
            "Telefon raqamingizni kiriting:"
        );


    if(!phone){

        return;

    }


    phone =
        phone.trim();


    try{

        const result =
            await api(
                "/api/passenger/order",
                {

                    ride_id:
                        rideId,

                    seats:
                        seats,

                    phone:
                        phone

                }
            );


        telegramAlert(
            result.message
            || "Buyurtma yuborildi."
        );


        if(
            tg
            && typeof tg.HapticFeedback !== "undefined"
        ){

            try{

                tg.HapticFeedback.notificationOccurred(
                    "success"
                );

            }catch(e){}

        }

    }
    catch(error){

        console.error(
            error
        );

        telegramAlert(
            error.message
            || "Buyurtma yuborishda xatolik."
        );

    }

}

/* =====================================================
   CANCEL RIDE
===================================================== */

async function cancelRide(id){

    if(!id){
        return;
    }


    let confirmed =
        true;


    if(
        tg
        && typeof tg.showConfirm === "function"
    ){

        confirmed =
            await new Promise(
                function(resolve){

                    tg.showConfirm(
                        "Safarni bekor qilasizmi?",
                        function(ok){

                            resolve(ok);

                        }
                    );

                }
            );

    }
    else{

        confirmed =
            confirm(
                "Safarni bekor qilasizmi?"
            );

    }


    if(!confirmed){
        return;
    }


    try{

        const result =
            await api(
                "/api/order/cancel",
                {
                    ride_id:id
                }
            );


        telegramAlert(
            result.message
            || "Safar bekor qilindi."
        );


        await loadMyRides();

    }
    catch(error){

        telegramAlert(
            error.message
            || "Safarni bekor qilishda xatolik."
        );

    }

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

    if(
        value === null
        || value === undefined
    ){

        return "";

    }


    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   DATE / TIME
===================================================== */

function setDateTimeDefaults(){

    const dateInput =
        document.getElementById(
            "rideDate"
        );


    const timeInput =
        document.getElementById(
            "rideTime"
        );


    const now =
        new Date();


    const year =
        now.getFullYear();


    const month =
        String(
            now.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    const day =
        String(
            now.getDate()
        ).padStart(
            2,
            "0"
        );


    const today =
        year
        + "-"
        + month
        + "-"
        + day;


    if(dateInput){

        dateInput.min =
            today;

    }


    if(
        dateInput
        && !dateInput.value
    ){

        dateInput.value =
            today;

    }


    if(
        timeInput
        && !timeInput.value
    ){

        const hours =
            String(
                now.getHours()
            ).padStart(
                2,
                "0"
            );


        const minutes =
            String(
                now.getMinutes()
            ).padStart(
                2,
                "0"
            );


        timeInput.value =
            hours
            + ":"
            + minutes;

    }

}
